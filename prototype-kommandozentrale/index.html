<!doctype html>
<!--
  PROTOTYP, Wegwerf-Code. Branch prototype/kommandozentrale, nie nach master.
  Frage: Wie sieht die Kommandozentrale von YT-OS aus? Vier Varianten (?variant=A..D),
  je zwei Zustände (?state=chris | tester). Spiegelt videos/, übergibt Aktionen als
  kopierbaren Claude-Code-Befehl. Kein Backend, keine Mutationen, nichts wird gespeichert.
  Start aus dem Repo-Root: python3 -m http.server 8765
  Dann: http://localhost:8765/prototype-kommandozentrale/
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp · YT-OS Kommandozentrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --bg: #0e0d0b;
  --bg-1: #141310;
  --bg-2: #1a1814;
  --bg-3: #221f1a;
  --line: #2a2620;
  --line-2: #3a352d;
  --ink: #f3ede3;
  --ink-2: #bdb4a6;
  --ink-3: #8f877b;
  --ink-4: #5f5950;
  --accent: #f0845c;
  --accent-2: #ffa47f;
  --accent-ink: #1d0f08;
  --accent-bg: #2a1810;
  --accent-line: #6e3a24;
  --done: #a9c49c;
  --done-bg: #18201a;
  --done-line: #344532;
  --gap-ochre: #d8b25c;
  --gap-bg: #1f1a0f;
  --gap-line: #5e4c22;
  --r-s: 6px;
  --r-m: 10px;
  --r-l: 16px;
  --sans: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --shadow-1: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-2: 0 18px 50px -18px rgba(0,0,0,.75), 0 2px 6px rgba(0,0,0,.35);
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-feature-settings: 'ss01' on;
}
::selection { background: var(--accent); color: var(--accent-ink); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2c2822; border-radius: 10px; border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #3b362e; }
* { scrollbar-color: #2c2822 transparent; scrollbar-width: thin; }
a { color: inherit; text-decoration-color: var(--ink-4); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: var(--ink); caret-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--ink-4); }
img { display: block; max-width: 100%; }
h1, h2, h3, h4 { margin: 0; font-weight: 750; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
.mono { font-family: var(--mono); font-feature-settings: 'zero' on; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.ic { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }
.ic-s { width: 13px; height: 13px; }
.ic-l { width: 20px; height: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#app { min-height: 100vh; }
#app.swap { animation: swap .42s var(--ease); }
@keyframes swap { from { opacity: 0; transform: translateY(6px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

/* ---------- gemeinsame Bausteine ---------- */
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.brand-mark svg { width: 15px; height: 15px; }
.brand-name { font-weight: 800; letter-spacing: -0.01em; font-size: 15px; line-height: 1.1; }
.brand-sub { color: var(--ink-3); font-size: 12px; line-height: 1.1; }

.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); font: 500 11.5px/1 var(--mono); white-space: nowrap; text-decoration: none; }
a.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip .ic { width: 12px; height: 12px; }
.chip--ticket { color: var(--ink); }
.chip--file { border-style: dotted; }

.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st i.d { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.st--fertig { color: var(--done); } .st--fertig i.d { background: var(--done); }
.st--laeuft { color: var(--ink); } .st--laeuft i.d { border: 2px solid var(--ink); }
.st--wartet { color: var(--accent-2); } .st--wartet i.d { background: var(--accent); box-shadow: 0 0 0 3px rgba(240,132,92,.18); }
.st--offen { color: var(--ink-3); } .st--offen i.d { border: 1.5px dashed var(--ink-3); }
.st--geplant { color: var(--ink-2); } .st--geplant i.d { border: 1.5px solid var(--ink-3); background: repeating-linear-gradient(45deg, var(--ink-3) 0 1px, transparent 1px 3px); }

/* Befehl zum Kopieren */
.cmd { position: relative; display: flex; align-items: stretch; border: 1px solid var(--line-2); background: #0a0908; border-radius: var(--r-s); overflow: hidden; }
.cmd-body { flex: 1; min-width: 0; padding: 9px 10px 9px 30px; font: 500 12.5px/1.5 var(--mono); color: var(--ink); white-space: pre-wrap; word-break: normal; overflow-wrap: break-word; position: relative; }
.cmd-body::before { content: '›'; position: absolute; left: 12px; top: 8px; color: var(--accent); font-weight: 600; }
.cmd--prompt .cmd-body { font-family: var(--sans); font-size: 13px; font-weight: 450; }
.cmd--prompt .cmd-body::before { content: '“'; font-family: var(--sans); font-size: 18px; top: 4px; left: 11px; }
.cmd-copy { flex: none; display: grid; place-items: center; width: 38px; border-left: 1px solid var(--line-2); color: var(--ink-2); transition: background .15s, color .15s; }
.cmd-copy:hover { background: var(--bg-3); color: var(--ink); }
.cmd.is-copied { border-color: var(--done-line); }
.cmd-copy .i-ok { display: none; }
.cmd.is-copied .i-copy { display: none; }
.cmd.is-copied .i-ok { display: block; }
.cmd.is-copied .cmd-copy { color: var(--done); background: var(--done-bg); }
.cmd-label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: var(--ink-3); }
.cmd--gap { border-style: dashed; border-color: var(--gap-line); background: var(--gap-bg); }
.cmd--gap .cmd-body { color: var(--gap-ochre); }
.cmd--gap .cmd-body::before { color: var(--gap-ochre); }
.cmd--empty .cmd-body { color: var(--ink-4); }

/* Platzhalter: fehlt in den Dateien */
.gap { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px dashed var(--gap-line); border-radius: var(--r-s); background: var(--gap-bg) repeating-linear-gradient(-45deg, transparent 0 7px, rgba(216,178,92,.04) 7px 14px); color: #e6cf97; font-size: 12.5px; line-height: 1.45; }
.gap .ic { color: var(--gap-ochre); margin-top: 1px; }
.gap b { color: var(--gap-ochre); font-weight: 650; }
.tag-gap { display: inline-flex; align-items: center; gap: 4px; min-height: 20px; padding: 3px 7px; line-height: 1.25 !important; white-space: normal !important; max-width: 100%; border-radius: 4px; border: 1px dashed var(--gap-line); color: var(--gap-ochre); font: 600 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.tag-branch { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 4px; border: 1px solid #3c4a5c; color: #9fb7d4; font: 600 10.5px/1 var(--mono); white-space: nowrap; }

/* Thumbnails */
.thumb { position: relative; aspect-ratio: 16/9; border-radius: var(--r-s); overflow: hidden; background: var(--bg-3); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb--btn { cursor: zoom-in; transition: transform .25s var(--ease), box-shadow .25s; }
.thumb--btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.yt-factor { position: absolute; right: 6px; bottom: 6px; padding: 2px 6px; border-radius: 4px; background: rgba(10,9,8,.86); color: var(--accent-2); font: 600 11px/1.3 var(--mono); }

/* Lightbox */
.lb { position: fixed; inset: 0; z-index: 90; background: rgba(8,7,6,.86); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 40px; animation: swap .3s var(--ease); }
.lb-inner { max-width: min(1100px, 92vw); width: 100%; }
.lb img { width: 100%; border-radius: var(--r-m); box-shadow: var(--shadow-2); }
.lb-meta { display: flex; justify-content: space-between; gap: 24px; margin-top: 14px; color: var(--ink-2); font-size: 13px; }
.lb-meta b { color: var(--ink); font-weight: 650; }

/* Schwebende Prototyp-Leiste */
.pbar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 80; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #f6f1e8; color: #17140f; box-shadow: 0 14px 40px -10px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.4); font-size: 13px; white-space: nowrap; }
.pbar button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; font-weight: 600; color: #17140f; }
.pbar button:hover { background: #e7e0d3; }
.pbar .pb-arrow { width: 32px; padding: 0; justify-content: center; }
.pbar .pb-label { min-width: 214px; justify-content: center; font-weight: 700; letter-spacing: -0.01em; }
.pbar .pb-label .k { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; background: #17140f; color: #f6f1e8; font: 700 11px/1 var(--mono); }
.pbar .pb-sep { width: 1px; height: 20px; background: #d5cdbf; margin: 0 4px; }
.pbar .pb-seg { display: inline-flex; padding: 2px; border-radius: 999px; background: #e5ddcf; }
.pbar .pb-seg button { height: 28px; padding: 0 11px; font-weight: 600; color: #5a5146; }
.pbar .pb-seg button[aria-pressed="true"] { background: #17140f; color: #f6f1e8; }
.pbar .pb-hint { color: #8a7f70; font: 500 11px/1 var(--mono); padding: 0 6px 0 2px; }
.pbar :focus-visible { outline-color: #17140f; }
.pinfo { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 81; width: min(560px, 94vw); padding: 16px 18px; border-radius: 14px; background: #f6f1e8; color: #17140f; box-shadow: 0 18px 50px -12px rgba(0,0,0,.8); font-size: 12.5px; animation: swap .3s var(--ease); }
.pinfo h4 { font-size: 13px; margin-bottom: 8px; }
.pinfo table { width: 100%; border-collapse: collapse; }
.pinfo td { padding: 4px 0; border-top: 1px solid #e2dacb; vertical-align: top; }
.pinfo td:first-child { font-family: var(--mono); font-size: 11.5px; padding-right: 14px; white-space: nowrap; }
.pinfo .state { margin-top: 10px; font: 500 11.5px/1.4 var(--mono); color: #6b6155; }

/* =========================================================
   A  Pipeline-Board
   ========================================================= */
.va { padding: 22px 28px 110px; }
.va-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; margin-bottom: 22px; }
.va-top h1 { font-size: 34px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 800; margin-top: 18px; }
.va-top h1 em { font-style: normal; color: var(--accent); }
.va-top p { color: var(--ink-2); margin-top: 6px; max-width: 64ch; }
.rail { width: 520px; flex: none; }
.rail-track { position: relative; height: 34px; }
.rail-line { position: absolute; left: 0; right: 0; top: 16px; height: 2px; background: var(--line-2); border-radius: 2px; }
.rail-done { position: absolute; left: 0; top: 16px; height: 2px; background: var(--ink-2); border-radius: 2px; }
.rail-pt { position: absolute; top: 11px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink-3); }
.rail-pt.is-gross { border-color: var(--ink); }
.rail-pt.is-heute { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(240,132,92,.2); }
.rail-lbls { position: relative; height: 34px; font-size: 11.5px; color: var(--ink-3); }
.rail-lbl { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; line-height: 1.25; }
.rail-lbl b { display: block; color: var(--ink); font-weight: 650; font-size: 12px; }
.rail-lbl.is-heute b { color: var(--accent-2); }
.rail-lbl.is-up { top: -48px; }
.rail-cap { display: flex; justify-content: space-between; font: 500 11px/1 var(--mono); color: var(--ink-4); margin-top: 2px; }

.setup-strip { display: grid; grid-template-columns: auto 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg-1); margin-bottom: 16px; overflow: hidden; }
.setup-strip > div { padding: 14px 16px; }
.setup-strip > div + div { border-left: 1px solid var(--line); }
.setup-strip .ss-h { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 190px; }
.setup-strip .ss-h b { font-size: 15px; }
.ss-step { display: grid; grid-template-columns: 26px 1fr; gap: 4px 10px; }
.ss-step .n { grid-row: span 3; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink-3); display: grid; place-items: center; font: 600 11.5px/1 var(--mono); color: var(--ink-2); }
.ss-step h4 { font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.ss-step p { color: var(--ink-2); font-size: 12.5px; }

.board { display: grid; gap: 10px; align-items: stretch; }
.col { display: flex; flex-direction: column; min-width: 0; border-radius: var(--r-m); background: var(--bg-1); border: 1px solid var(--line); }
.col-h { padding: 12px 12px 11px; border-bottom: 1px solid var(--line); min-height: 116px; display: flex; flex-direction: column; gap: 5px; }
.col-t { display: flex; align-items: center; gap: 7px; }
.col-nr { font: 600 11px/1 var(--mono); color: var(--ink-3); width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line-2); display: grid; place-items: center; flex: none; }
.col-name { font-weight: 750; font-size: 14px; letter-spacing: -0.01em; line-height: 1.15; }
.col-q { color: var(--ink-3); font-size: 12px; line-height: 1.3; }
.col-tool { margin-top: auto; display: flex; align-items: flex-start; gap: 6px; font-size: 11.5px; line-height: 1.3; color: var(--ink-2); }
.col-tool .ic { width: 13px; height: 13px; margin-top: 1px; }
.col-tool.t-fehlt { color: var(--gap-ochre); }
.col-tool.t-branch { color: #9fb7d4; }
.col-tool.t-gebaut { color: var(--done); }
.col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.col.is-hot { background: linear-gradient(180deg, #1b1510 0, var(--bg-1) 220px); border-color: #3a2a20; }

.card { border-radius: var(--r-m); background: var(--bg-2); border: 1px solid var(--line-2); padding: 10px; display: flex; flex-direction: column; gap: 9px; box-shadow: var(--shadow-1); }
.card .thumb { border-radius: 7px; }
.img-note { position: absolute; left: 6px; top: 6px; padding: 2px 6px; border-radius: 4px; background: rgba(10,9,8,.82); color: var(--ink-2); font-size: 10.5px; font-weight: 600; }
.card-h { display: flex; gap: 9px; align-items: baseline; }
.card-nr { font: 700 12px/1 var(--mono); color: var(--accent-2); }
.card h3 { font-size: 16px; line-height: 1.15; letter-spacing: -0.02em; }
.card .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.card-do { border-radius: 7px; background: var(--accent-bg); border: 1px solid var(--accent-line); padding: 9px 10px; display: flex; flex-direction: column; gap: 4px; }
.card-do b { color: var(--accent-2); font-size: 13px; font-weight: 700; line-height: 1.3; }
.card-do span { color: #e4c1b0; font-size: 12px; line-height: 1.35; }
.card-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.segs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.segs i { height: 4px; border-radius: 2px; background: var(--line-2); }
.segs i.s-fertig { background: var(--done); }
.segs i.s-wartet { background: var(--accent); }
.segs i.s-laeuft { background: var(--ink); }
.segs i.s-geplant { background: repeating-linear-gradient(90deg, var(--ink-3) 0 3px, transparent 3px 5px); }

.row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; border: 1px solid transparent; font-size: 12.5px; }
.row .nr { font: 600 11.5px/1 var(--mono); color: var(--ink-3); }
.row { align-items: flex-start; }
.row .ic, .row .nr { margin-top: 2px; }
.row .txt { min-width: 0; flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; color: var(--ink-2); line-height: 1.35; }
.row--fertig { background: var(--done-bg); border-color: var(--done-line); }
.row--fertig .txt { color: #c6d8bd; }
.row--fertig .ic { color: var(--done); }
.row--wartet { background: var(--accent-bg); border-color: var(--accent-line); }
.row--wartet .txt { color: #f2c6b1; }
.row--wartet .ic { color: var(--accent); }
.row--laeuft { border-color: var(--line-2); }
.row--geplant, .row--offen { border: 1px dashed var(--line-2); }
.row--geplant .txt, .row--offen .txt { color: var(--ink-3); }

.col.is-collapsed { background: repeating-linear-gradient(-45deg, var(--bg) 0 6px, var(--bg-1) 6px 12px); border-style: dashed; align-items: center; padding: 12px 0; opacity: .8; }
.col-vert { writing-mode: vertical-rl; transform: rotate(180deg); display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.col-vert .col-nr { transform: rotate(90deg); }
.col-vert em { font-style: normal; color: var(--ink-4); font-weight: 500; }

.empty-col { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px dashed var(--line-2); border-radius: var(--r-m); color: var(--ink-3); font-size: 12.5px; line-height: 1.45; }
.empty-col .skills { display: flex; flex-direction: column; gap: 4px; }
.empty-col .skills span { font: 500 11.5px/1.3 var(--mono); color: var(--ink-2); }

.start { border-radius: var(--r-l); border: 1px solid var(--accent-line); background: linear-gradient(180deg, #24150e, var(--bg-2) 70%); padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-2); }
.start h3 { font-size: 21px; line-height: 1.1; letter-spacing: -0.03em; }
.start p { color: var(--ink-2); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.field label span { color: var(--ink-4); font-weight: 500; }
.inp { width: 100%; height: 36px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line-2); background: #0b0a09; outline: none; transition: border-color .15s, box-shadow .15s; font-size: 13px; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,132,92,.15); }
.inp.mono { font-family: var(--mono); font-size: 12px; }
textarea.inp { height: auto; padding: 9px 11px; resize: vertical; line-height: 1.55; }
.hint { font-size: 12px; color: var(--ink-3); line-height: 1.4; }
.hint b { color: var(--ink-2); font-weight: 600; }
.or { display: flex; align-items: center; gap: 10px; color: var(--ink-4); font-size: 11.5px; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }
.alt { border: 1px dashed var(--gap-line); border-radius: var(--r-m); padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--gap-bg); }
.alt h4 { font-size: 13.5px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.alt p { font-size: 12.5px; color: #d9c9a2; }

/* =========================================================
   B  Video-Akte
   ========================================================= */
.vb { display: grid; grid-template-columns: 252px minmax(0, 1fr) 356px; min-height: 100vh; }
.vb-rail { border-right: 1px solid var(--line); padding: 20px 14px 100px; position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 22px; background: var(--bg-1); }
.vb-rail h5 { margin: 0 0 8px 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.vlist { display: flex; flex-direction: column; gap: 4px; }
.vitem { display: grid; grid-template-columns: 34px 1fr; gap: 2px 10px; width: 100%; text-align: left; padding: 10px; border-radius: var(--r-m); border: 1px solid transparent; transition: background .15s; }
.vitem:hover { background: var(--bg-2); }
.vitem[aria-current="true"] { background: var(--bg-2); border-color: var(--line-2); }
.vitem .n { grid-row: span 3; font: 700 22px/1 var(--mono); color: var(--ink-3); letter-spacing: -0.04em; padding-top: 2px; }
.vitem[aria-current="true"] .n { color: var(--accent); }
.vitem .t { font-weight: 700; font-size: 13.5px; line-height: 1.2; }
.vitem .segs { margin-top: 7px; }
.vitem--new { border: 1px dashed var(--line-2); color: var(--ink-2); }
.vitem--new .n { color: var(--ink-3); }
.vb-railfoot { margin-top: auto; font-size: 12px; color: var(--ink-3); line-height: 1.5; padding: 0 6px; }
.vb-railfoot b { color: var(--ink); font-weight: 650; }

.vb-main { padding: 34px 44px 120px; min-width: 0; }
.vb-head { display: grid; grid-template-columns: auto 1fr; gap: 0 22px; align-items: start; padding-bottom: 26px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.vb-num { font: 700 92px/0.82 var(--mono); letter-spacing: -0.08em; color: transparent; -webkit-text-stroke: 1.5px var(--ink-4); }
.vb-head h1 { font-size: 44px; line-height: 1; letter-spacing: -0.04em; font-weight: 820; }
.vb-head h1 span { display: block; color: var(--ink-3); font-weight: 600; font-size: 26px; letter-spacing: -0.025em; margin-top: 6px; }
.vb-quote { margin-top: 14px; color: var(--ink-2); font-size: 15px; max-width: 62ch; font-style: italic; }
.vb-facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 14px; font-size: 13px; color: var(--ink-3); }
.vb-facts b { color: var(--ink); font-weight: 650; }
.vb-title-inp { width: 100%; background: transparent; border: 0; border-bottom: 2px dashed var(--line-2); font: 800 34px/1.1 var(--sans); letter-spacing: -0.035em; color: var(--ink); padding: 4px 0 8px; outline: none; }
.vb-title-inp:focus { border-bottom-color: var(--accent); }

.tl { position: relative; }
.tl::before { content: ''; position: absolute; left: 17px; top: 30px; bottom: 30px; width: 2px; background: var(--line); }
.tl-st { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 0 18px; padding: 22px 0; }
.tl-st + .tl-st { border-top: 1px solid var(--line); }
.tl-node { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1.5px solid var(--line-2); color: var(--ink-3); }
.tl-st.s-fertig .tl-node { border-color: var(--done-line); background: var(--done-bg); color: var(--done); }
.tl-st.s-wartet .tl-node { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px rgba(240,132,92,.12); }
.tl-st.s-laeuft .tl-node { border-color: var(--ink); color: var(--ink); }
.tl-st.is-off { opacity: .45; }
.tl-st.is-off .tl-node { border-style: dashed; }
.tl-hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 36px; }
.tl-hd h2 { font-size: 20px; letter-spacing: -0.025em; }
.tl-hd h2 small { font: 600 12px/1 var(--mono); color: var(--ink-3); margin-right: 8px; vertical-align: 3px; }
.tl-hd .when { color: var(--ink-3); font-size: 12.5px; }
.tl-hd .right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.tl-sum { color: var(--ink-2); margin-top: 6px; max-width: 72ch; font-size: 14px; }
.tl-body { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
details.more > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 12.5px; font-weight: 600; margin-top: 10px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary:hover { color: var(--ink); }
details.more[open] > summary .ic { transform: rotate(90deg); }
details.more > summary .ic { transition: transform .2s var(--ease); }

.ol-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; }
.ol { display: flex; flex-direction: column; gap: 7px; text-decoration: none; }
.ol .t { font-size: 12.5px; line-height: 1.3; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ol .k { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ol .k .v { font: 600 10.5px/1 var(--mono); color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 2px 4px; }
.ol:hover .t { color: var(--accent-2); }

.blocks { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.blk { padding: 9px 8px 10px; border-radius: 7px; background: var(--bg-2); border: 1px solid var(--line); min-height: 70px; display: flex; flex-direction: column; gap: 6px; }
.blk i { font: 600 10.5px/1 var(--mono); color: var(--ink-4); font-style: normal; }
.blk b { font-size: 12px; line-height: 1.2; font-weight: 650; }
.stats { display: flex; gap: 26px; flex-wrap: wrap; }
.stat b { display: block; font: 600 22px/1.1 var(--mono); letter-spacing: -0.03em; }
.stat span { font-size: 12px; color: var(--ink-3); }

.titles { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.trow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 170px 150px; gap: 14px; align-items: center; padding: 10px 14px; font-size: 13px; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow .key { font: 700 13px/1 var(--mono); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--bg-3); color: var(--ink); }
.trow .tx { font-weight: 600; }
.trow .tx small { display: block; color: var(--ink-3); font-weight: 400; font-size: 12px; margin-top: 2px; }
.trow .pm { color: var(--ink-2); font-size: 12.5px; }
.trow.is-out { color: var(--ink-4); }
.trow.is-out .tx { text-decoration: line-through; text-decoration-color: var(--ink-4); color: var(--ink-3); }
.trow.is-rec .key { background: var(--accent); color: var(--accent-ink); }

.recs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rec { display: flex; flex-direction: column; gap: 8px; }
.rec .thumb { box-shadow: var(--shadow-2); }
.rec-n { position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 13px/1 var(--mono); }
.rec p { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
.rec p b { color: var(--ink); }

.days { display: flex; flex-direction: column; gap: 14px; }
.day h4 { font-size: 13px; font-weight: 650; margin-bottom: 7px; display: flex; gap: 10px; align-items: baseline; }
.day h4 span { color: var(--ink-3); font-weight: 500; font-size: 12px; }
.tgrid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.tgrid .thumb { border-radius: 4px; }

.dreh { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.dreh img { border-radius: var(--r-m); border: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; font-size: 13px; }
.kv > * { padding: 8px 12px; }
.kv > :nth-child(n+3) { border-top: 1px solid var(--line); }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; }

.cuts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cut { border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; background: var(--bg-1); display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.cut b.d { font: 600 24px/1 var(--mono); letter-spacing: -0.04em; }
.cut .nm { font-weight: 700; font-size: 13px; }
.cut .p { color: var(--done); } .cut .m { color: #e9a58a; }
.tone { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tone > div { border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.tone b { color: var(--ink); font-size: 13px; }
.tone .is-no { opacity: .55; }
.tone .flag { font-size: 11.5px; font-weight: 650; }

.checks { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.checks > div { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 13px; }
.checks > div + div { border-top: 1px solid var(--line); }
.checks .r { margin-left: auto; }

.vb-aside { border-left: 1px solid var(--line); padding: 24px 22px 120px; position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 22px; }
.next { border-radius: var(--r-l); background: linear-gradient(180deg, #26170f 0, var(--bg-2) 85%); border: 1px solid var(--accent-line); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-2); }
.next .lbl { display: flex; align-items: center; gap: 8px; color: var(--accent-2); font-weight: 700; font-size: 13px; }
.next h3 { font-size: 22px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 800; }
.next p { color: #d7bfb2; font-size: 13px; }
.next .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.aside-sec h5 { margin: 0 0 8px; font-size: 13px; font-weight: 700; }
.mini { display: flex; flex-direction: column; gap: 6px; }
.mini > * { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.mini .dt { font: 600 11.5px/1 var(--mono); color: var(--ink); width: 46px; flex: none; }

/* =========================================================
   C  Entscheidungs-Tisch
   ========================================================= */
.vc { padding: 0 0 120px; }
.vc-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; border-bottom: 1px solid var(--line); }
.vc-grid { display: grid; grid-template-columns: 318px minmax(0, 1fr); min-height: calc(100vh - 59px); }
.queue { border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; }
.queue h2 { font-size: 26px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 820; padding: 0 8px 4px; }
.queue h2 em { font-style: normal; color: var(--accent); }
.queue .qsub { padding: 0 8px 14px; color: var(--ink-3); font-size: 12.5px; }
.qi { display: grid; grid-template-columns: 32px 1fr; gap: 2px 10px; padding: 11px 10px; border-radius: var(--r-m); text-align: left; width: 100%; border: 1px solid transparent; transition: background .15s, border-color .15s; }
.qi:hover { background: var(--bg-1); }
.qi[aria-current="true"] { background: var(--bg-2); border-color: var(--line-2); }
.qi .ico { grid-row: span 2; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--bg-3); color: var(--ink-2); }
.qi[aria-current="true"] .ico { background: var(--accent); color: var(--accent-ink); }
.qi .t { font-weight: 700; font-size: 13.5px; line-height: 1.25; }
.qi .m { font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qi.is-done .ico { background: var(--done-bg); color: var(--done); }
.qi.is-done .t { color: var(--ink-2); }
.qi.is-later { opacity: .55; cursor: default; }
.qi.is-later .ico { background: transparent; border: 1px dashed var(--line-2); }
.qhead { padding: 18px 8px 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }

.table { padding: 28px 36px 40px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.table-q { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; }
.table-q h1 { font-size: 36px; line-height: 1.04; letter-spacing: -0.04em; font-weight: 820; max-width: 22ch; }
.table-q p { color: var(--ink-2); margin-top: 10px; max-width: 70ch; }
.table-q .acts { display: flex; gap: 8px; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line-2); font-weight: 600; font-size: 13px; color: var(--ink); background: var(--bg-1); transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--bg-3); border-color: var(--ink-4); }
.btn--hot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn--hot:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn--ghost { background: transparent; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--bg-1); }
.seg button { height: 28px; padding: 0 11px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--bg-3); color: var(--ink); }

.pick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.pick-grid.is-dense { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.pick { display: flex; flex-direction: column; gap: 7px; text-align: left; border-radius: var(--r-m); padding: 6px; border: 1.5px solid transparent; transition: border-color .15s, background .15s; }
.pick:hover { background: var(--bg-1); }
.pick .thumb { border-radius: 7px; }
.pick.is-sel { border-color: var(--accent); background: var(--accent-bg); }
.pick .ord { position: absolute; left: 8px; top: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 15px/1 var(--mono); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.pick .rec-dot { position: absolute; right: 8px; top: 8px; padding: 3px 7px; border-radius: 999px; background: rgba(10,9,8,.85); color: var(--accent-2); font-size: 10.5px; font-weight: 700; }
.pick .zoom { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 6px; background: rgba(10,9,8,.8); display: grid; place-items: center; color: var(--ink-2); opacity: 0; transition: opacity .15s; }
.pick:hover .zoom { opacity: 1; }
.pick .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-3); padding: 0 2px; }
.pick .cap b { color: var(--ink); font-weight: 650; }
.pick-grid.is-dense .cap { font-size: 11px; }

.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.slot { display: grid; grid-template-columns: 30px 120px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border-radius: var(--r-m); border: 1px solid var(--line-2); background: var(--bg-1); min-height: 84px; }
.slot.is-empty { border-style: dashed; color: var(--ink-4); }
.slot .n { font: 700 18px/1 var(--mono); color: var(--accent); text-align: center; }
.slot.is-empty .n { color: var(--ink-4); }
.slot .tx { font-size: 12px; line-height: 1.35; color: var(--ink-2); }
.slot .tx b { display: block; color: var(--ink); font-size: 12.5px; font-weight: 650; margin-bottom: 2px; }
.slot .thumb { border-radius: 5px; }
.slot .ph { aspect-ratio: 16/9; border-radius: 5px; border: 1px dashed var(--line-2); }
.rule { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.rule.ok { color: var(--done); }
.rule.no { color: var(--gap-ochre); }

.opts { display: grid; gap: 14px; }
.opt { position: relative; text-align: left; border-radius: var(--r-l); border: 1.5px solid var(--line-2); background: var(--bg-1); padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: border-color .15s, background .15s, transform .25s var(--ease); }
.opt:hover { border-color: var(--ink-4); }
.opt.is-sel { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-bg), var(--bg-1) 70%); }
.opt.is-no { opacity: .5; }
.opt-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.opt-h h3 { font-size: 16px; line-height: 1.2; }
.opt-h .radio { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink-3); flex: none; display: grid; place-items: center; }
.opt.is-sel .radio { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.opt .big { font: 600 38px/1 var(--mono); letter-spacing: -0.05em; }
.opt dl { margin: 0; display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 12.5px; }
.opt dt { color: var(--ink-3); }
.opt dd { margin: 0; color: var(--ink); }
.opt .p { color: var(--done); } .opt .m { color: #eaa68b; }
.media-ph { aspect-ratio: 16/6; border-radius: var(--r-m); border: 1px dashed var(--gap-line); background: var(--gap-bg) repeating-linear-gradient(-45deg, transparent 0 7px, rgba(216,178,92,.04) 7px 14px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #e6cf97; font-size: 12px; text-align: center; padding: 10px; }
.media-ph .ic { color: var(--gap-ochre); width: 22px; height: 22px; }
.media-ph code { font: 500 11px/1.3 var(--mono); color: var(--gap-ochre); }

.tray { position: sticky; bottom: 64px; z-index: 5; margin-top: 6px; border-radius: var(--r-l); border: 1px solid var(--line-2); background: rgba(20,19,16,.92); backdrop-filter: blur(14px); padding: 14px 16px; display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: center; box-shadow: var(--shadow-2); }
.tray h4 { font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.tray h4 span { color: var(--ink-3); font-weight: 500; font-size: 12px; }

.later { padding: 20px; border: 1px dashed var(--line-2); border-radius: var(--r-l); color: var(--ink-3); }
.qs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.paths { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

/* =========================================================
   D  Begleiter
   ========================================================= */
.vd { display: grid; grid-template-columns: minmax(0, 1fr) 404px; min-height: 100vh; background: radial-gradient(1200px 600px at 20% 10%, #15130f, var(--bg)); }
.vd-host { padding: 28px 28px 100px 36px; display: flex; flex-direction: column; gap: 12px; }
.vd-hostlbl { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 12px; }
.term { flex: 1; border-radius: 14px; border: 1px solid var(--line); background: #0a0908; box-shadow: var(--shadow-2); display: flex; flex-direction: column; overflow: hidden; }
.term-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font: 500 12px/1 var(--mono); color: var(--ink-3); }
.term-bar i { width: 10px; height: 10px; border-radius: 50%; background: #2b2722; }
.term-body { flex: 1; padding: 22px 24px; font: 400 13px/1.7 var(--mono); color: var(--ink-4); display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
.term-body .ln-in { color: var(--ink); white-space: pre-wrap; }
.term-body .ln-in::before { content: '> '; color: var(--accent); }
.term-body .ln-note { color: var(--ink-3); font-family: var(--sans); font-size: 12.5px; }
.term-caret { display: inline-block; width: 8px; height: 15px; background: var(--accent); vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.side { border-left: 1px solid var(--line); background: var(--bg-1); height: 100vh; position: sticky; top: 0; overflow: auto; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 18px; }
.side-top { display: flex; align-items: center; justify-content: space-between; }
.side-top .day { font: 600 12px/1 var(--mono); color: var(--ink-2); }
.count { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--bg); }
.count b { font: 600 30px/1 var(--mono); letter-spacing: -0.05em; color: var(--ink); }
.count span { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
.now { border-radius: var(--r-l); border: 1px solid var(--accent-line); background: linear-gradient(180deg, #26170f, var(--bg-2) 80%); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-2); }
.now .lbl { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--accent-2); font-weight: 700; font-size: 12.5px; }
.now h3 { font-size: 19px; line-height: 1.12; letter-spacing: -0.03em; font-weight: 800; }
.now p { color: #d7bfb2; font-size: 12.5px; }
.now .acts { display: flex; gap: 6px; }
